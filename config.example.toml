# Example config, copied to `<game>/fh6-radio/config.toml` on first install.
# Everything is editable from the dashboard; you only need to touch this file
# if you prefer hand edits. Windows paths should use TOML literal strings
# (single quotes) so backslashes pass through verbatim:
#
#   ffmpeg_path = 'C:\tools\ffmpeg.exe'

[general]
port              = 8420
ring_buffer_mb    = 4
default_source    = "shoutcast"
fallback_source   = "shoutcast"
enable_overlay    = true                        # set false if game anti-cheat crashes on D3D12 overlay hooks

[shoutcast]
enabled            = true
default_url        = ""                          # auto-connect on startup
ffmpeg_path        = ""                          # blank = `ffmpeg` on PATH
presets            = []                          # e.g. ["http://server:8000/stream"]

[audio]
output_gain = 1.0
